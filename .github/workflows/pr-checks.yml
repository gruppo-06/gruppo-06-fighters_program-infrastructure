name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|style|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title '$TITLE' must follow Conventional Commits, e.g. 'feat(cards): add deck builder'"
            exit 1
          fi

      - name: Check branch name and target
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$HEAD" in
            dependabot/*|release-please--*) exit 0 ;;
          esac

          if [[ "$BASE" == "main" ]]; then
            if [[ "$HEAD" != "develop" && ! "$HEAD" =~ ^hotfix/[a-z0-9._-]+$ ]]; then
              echo "::error::Only 'develop' and 'hotfix/*' branches can be merged into main (got '$HEAD')"
              exit 1
            fi
            exit 0
          fi

          if [[ "$BASE" == "develop" && "$HEAD" == "main" ]]; then
            exit 0
          fi

          pattern='^(feature|fix|refactor|test|docs|chore|hotfix)/[a-z0-9][a-z0-9._-]*$'
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD' must be named <type>/<kebab-case-description>, with type one of feature, fix, refactor, test, docs, chore, hotfix"
            exit 1
          fi
